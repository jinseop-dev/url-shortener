name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: ['completed']
    branches: ['main']

jobs:
  cd:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKER_IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -euo pipefail
            
            # SSM에서 DB 접속 정보 조회
            SPRING_DATASOURCE_URL=$(aws ssm get-parameter \
              --name "SPRING_DATASOURCE_URL" \
              --query "Parameter.Value" \
              --output text)

            SPRING_DATASOURCE_USERNAME=$(aws ssm get-parameter \
              --name "SPRING_DATASOURCE_USERNAME" \
              --query "Parameter.Value" \
              --output text)

            SPRING_DATASOURCE_PASSWORD=$(aws ssm get-parameter \
              --name "SPRING_DATASOURCE_PASSWORD" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text)
            
            # Docker Hub 로그인 및 이미지 다운로드
            echo "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

            docker pull "$DOCKERHUB_USERNAME/app:$DOCKER_IMAGE_TAG"
            
            # 기존 컨테이너 제거
            docker rm -f app || true
            
            # 새 컨테이너 실행
            docker run -d \
              --name app \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
              -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              "$DOCKERHUB_USERNAME/app:$DOCKER_IMAGE_TAG"